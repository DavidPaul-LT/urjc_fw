<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Shop Homepage</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="" />
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
        <link rel="stylesheet" href="css/navBar.css">
        <link rel="stylesheet" href="css/carousel.css">
        <link rel="stylesheet" href="css/card.css">
        <link rel="stylesheet" href="/basura.css"> <!-- añadido Paul-->
    </head>
    <body>
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-info">
            <div class="container px-4 px-lg-5">
                <a class="navbar-brand" href="#!">Shop</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                        <li id="home" class="nav-item"><a class="nav-link active" aria-current="page" href="#!" onclick="new PaginaPrincipal(storage)">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#!">Sobre nosotros</a></li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Productos</a>
                            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="#!">Todas las categorías</a></li>
                                <li><hr class="dropdown-divider" /></li>
                                <li><a class="dropdown-item" href="#!">Hombre</a></li>
                                <li><a class="dropdown-item" href="#!">Mujer</a></li>
                            </ul>
                        </li>
                    </ul>
                    <form class="d-flex">
                        <a class="btn btn-outline-light" onclick="let aux2 = new PaginaCarrito(null)">
                            <i class="bi-cart-fill me-1"></i>
                            Carrito
                            <span id="carrito" class="badge bg-dark text-white ms-1 rounded-pill">0</span>
                        </a>
                    </form>
                </div>
            </div>
        </nav>
        <!-- Header-->
        <header class="py-5 bg-black">
            <div class="container px-4 px-lg-5 my-5" style="background-image: url(index_images/black-friday.svg);height: 50%;">
                <div class="text-center text-white">    
                    <h1 class="display-4 fw-bolder text-warning">Store</h1>
                    <p class="lead fw-normal text-danger mb-0">UP TO 50% OFF</p>
                </div>
            </div>
        </header>
        <!-- Section-->
        <section class="py-5">
            
        </section>

        <!-- Formulario -->

        <div class="container contact-form" id="contactForm" style="display: none;">
            <div class="contact-image">
                <img src="/index/index_images/logoImg.jpeg" alt="rocket_contact"/>
            </div>
            <form method="post" id="form">
               <div class="row">
                    <div class="col-md-6" >
                        <fieldset disabled class="form-group py-1">
                            <input id="codigo" class="form-control" placeholder="Disabled input" value=""/>
                        </fieldset>
                        <div class="form-group py-1">
                            <input id="nombre" type="text" class="form-control" placeholder="" value=""/>
                        </div>
                        <div class="form-group py-1">
                            <input id="img" type="text" class="form-control" placeholder="" value=""/>
                        </div>
                        <div class="form-group py-1">
                            <input id="precio" type="text" class="form-control" placeholder="" value=""/>
                        </div>
                        <div class="form-group py-1 text-center">
                            <div id="btnSubmit" class="btnContact" onclick="modificarProducto()">Submit</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group py-1">
                            <textarea id="descripcion" name="txtMsg" class="form-control" placeholder="Descripcion" style="width: 100%; height: 175px;"></textarea>
                        </div>
                    </div>
                </div>
            </form>
        </div>


        <!-- Footer-->
        <footer class="py-5 bg-info">
            <div class="container"><p class="m-0 text-center text-white">Copyright &copy; Your Website 2022</p></div>
        </footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
        <script src="js/scripts.js"></script>
        <script src="/basura.js"></script>
    </body>
</html>
