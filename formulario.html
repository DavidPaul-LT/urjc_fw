<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <!-- CSS Boostrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <link rel="stylesheet" href="../formulario.css">
    <link rel="stylesheet" href="/Product/card.css">
  </head>
  <body>
    <section class="py-5">
      <div class="container px-4 px-lg-5 mt-5">
        <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center" id="ContenedorProductostwo">
          
          <!-- Form -->
          <section class="text-center" id="formId">
            <button id="btnShowForm" class="btn btn-outline-dark col" onclick="btnShowForm()">Añadir Producto</button>
            
            <form id="form" style="display: none; border: 1px solid black;">
              <div class="mb-5">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control  has-validation" id="nombreForm">
              </div>
                <div class="mb-5">
                  <label class="form-label">Imagen</label>
                  <input type="text" class="form-control" id="imgForm">
                </div>
                <div class="mb-5">
                  <label class="form-label">Precio</label>
                  <input type="text" class="form-control" id="priceForm">
                </div>
              </form>
            <button id="btnForm" class="btn btn-outline-dark col mb-5" style="display: none;" onclick="saveProduct()">Submit</button>
          </section>
          
          <!-- PRODUCTO DE PRUEBA 1-->
          <product class="col mb-5" style="border: none; ; background-color: transparent;" onclick="savePage()">
            <card class="card h-100">
              <!-- Product image-->
              <img class="card-img-top" src="../product/product_Images/1234.JPG" alt="..." />
              <!-- Product details-->
              <card2 class="card-body p-4 text-center">
                <attributes class="text-center">
                  <!-- Product name-->
                  <h5 class="fw-bolder">Stretch Sweater Fleece Shirt</h5>
                  <!-- Product price-->
                  <p>$60.00</p>
                </attributes>
              </card2>
              <!-- Product actions-->
              <footerCard class="card-footer p-4 pt-0 border-top-0 bg-transparent text-center">
                <buttonDelete class="text-center btn btn-outline-dark" onclick="productRemover(this)">Delete</div>
              </footerCard>
            </card>
          </product>
        
        </div>
      </div>
    </section>
    <script src="https://kit.fontawesome.com/268bb10e54.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
    <script src="/Product/estrellas.js"></script>
    <script src="../Form.js"></script>
  </body>
</html>
